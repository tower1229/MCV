name: Release Gate

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Verify macOS PTY prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: test -x /usr/bin/expect && test -x /bin/zsh
      - run: npm run typecheck
      - run: npm run build
      - name: Unit and architecture tests
        run: npm test
      - name: Packaged CLI acceptance matrix
        run: npx vitest run src/cli.process.test.ts
      - name: Native Windows ConPTY acceptance matrix
        if: runner.os == 'Windows'
        run: npx vitest run src/tui/menu/app.windows-pty.test.ts src/tui/capture/app.windows-pty.test.ts src/tui/profile/app.windows-pty.test.ts
      - name: Native macOS PTY acceptance matrix
        if: runner.os == 'macOS'
        run: npx vitest run src/tui/menu/app.pty.test.ts src/tui/capture/app.pty.test.ts src/tui/profile/app.pty.test.ts
      - run: node dist/index.js --help
      - run: npm pack --dry-run
